<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d4d"><title>CollectPlus — Formulaire public</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
:root{--navy:#102d4d;--accent:#078f9d}body{background:linear-gradient(145deg,#eef4fb,#f8fbff);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324f;margin:0}
.public-shell{max-width:850px;margin:32px auto;padding:0 16px}.public-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#087e91,#10a99b);display:grid;place-items:center;color:white;font-weight:900;font-size:22px;box-shadow:0 7px 18px #0a879129}.brand-label strong{display:block;font-size:18px}.brand-label small{color:#7d90a4;font-size:10px;letter-spacing:1.2px;font-weight:800}
.public-card{background:white;border:1px solid #dce7f1;border-radius:20px;box-shadow:0 15px 45px #1b3d5c0c;overflow:hidden}.public-head{padding:25px 28px;background:linear-gradient(110deg,#103e61,#078e9b);color:white}.public-head .kicker{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#bcebe7}.public-head h1{font-size:25px;margin:9px 0 7px;line-height:1.25}.public-head p{font-size:13px;color:#e2f3f5;margin:0;line-height:1.6}.public-body{padding:25px 28px}.public-section{border:1px solid #e4edf5;border-radius:14px;padding:18px;margin-bottom:15px;background:#fcfdff}.public-section h2{font-size:15px;margin:0 0 5px;color:#173b5c}.public-section>p{font-size:11px;color:#8092a4;margin:0 0 15px}.public-questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.public-question{min-width:0}.public-question.full{grid-column:1/-1}.public-question label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#36516c}.public-question input,.public-question select,.public-question textarea{width:100%;box-sizing:border-box;border:1px solid #d8e4ef;border-radius:9px;background:white;padding:10px 11px;font:inherit;font-size:13px;color:#203c5a;outline:none}.public-question input:focus,.public-question select:focus,.public-question textarea:focus{border-color:#0b98a5;box-shadow:0 0 0 3px #0b98a516}.public-question .choice{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:12px}.public-question .choice input{width:auto}.hint{font-size:10px;color:#8193a6;margin-top:5px}.req{color:#e35f57}.public-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.public-actions button{border:0;border-radius:10px;padding:12px 18px;background:linear-gradient(120deg,#078f9d,#087e91);color:white;font-weight:800;cursor:pointer}.public-actions .gps{background:#eef7fa;color:#167f91;border:1px solid #d5ebef}.public-footer{text-align:center;color:#8b9bab;font-size:10px;margin:18px 0}.alert{padding:12px;border-radius:10px;background:#e8f8f0;color:#177d5d;font-size:12px;margin-bottom:12px}.alert.error{background:#fff0ed;color:#b74a40}.loading{text-align:center;padding:45px;color:#8092a4}
@media(max-width:600px){.public-shell{margin:14px auto}.public-head,.public-body{padding:20px}.public-questions{grid-template-columns:1fr}.public-question.full{grid-column:auto}.public-head h1{font-size:21px}.public-actions{flex-direction:column;align-items:stretch}}
</style>
</head><body><main class="public-shell">
<div class="public-brand"><div class="brand-logo">✓</div><div class="brand-label"><strong>CollectPlus</strong><small>COLLECTE · ANALYSE</small></div></div>
<article class="public-card"><header class="public-head"><div class="kicker">FORMULAIRE DE COLLECTE</div><h1 id="formTitle">Chargement du formulaire…</h1><p id="formDescription"></p></header><div class="public-body"><div id="message"></div><form id="publicForm"><div id="formSections" class="loading">Veuillez patienter…</div><div class="public-actions"><button type="button" class="gps" id="gpsButton">⌖ Ajouter ma position GPS</button><button type="submit" id="submitButton">Envoyer ma réponse →</button></div></form></div></article>
<div class="public-footer">Formulaire partagé via CollectPlus · Votre réponse sera transmise à l’organisateur de l’enquête.</div>
</main>
<script>
(()=>{
const token=location.pathname.split('/').filter(Boolean).pop(), $=s=>document.querySelector(s);let schema=null,geo=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function questionMarkup(q){
 const n=esc(q.name), label=esc(q.label),req=q.required?' required':'',star=q.required?' <span class="req">*</span>':'',hint=q.hint?`<div class="hint">${esc(q.hint)}</div>`:'';
 let control='';
 if(q.type==='note')return `<div class="public-question full" data-q="${n}"><div class="hint">${label}</div></div>`;
 if(['select','select_one'].includes(q.type))control=`<select name="${n}"${req}><option value="">Sélectionner…</option>${(q.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
 else if(['multiselect','select_multiple'].includes(q.type))control=`<div>${(q.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="${n}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
 else if(['textarea'].includes(q.type))control=`<textarea name="${n}" rows="3"${req}></textarea>`;
 else if(['image','file'].includes(q.type))control=`<input type="file" name="${n}" accept="image/*"${req}>`;
 else {const t=['date','time','number','email','tel'].includes(q.type)?q.type:'text';control=`<input type="${t}" name="${n}"${req}${q.placeholder?` placeholder="${esc(q.placeholder)}"`:''}>`;}
 const full=['textarea','multiselect','select_multiple','image','file'].includes(q.type)||(q.options||[]).length>4;
 return `<div class="public-question ${full?'full':''}" data-q="${n}" data-relevant="${esc(q.relevant||'')}" data-required="${q.required?'true':'false'}"><label>${label}${star}</label>${control}${hint}</div>`;
}
function render(){
 $('#formTitle').textContent=schema.title||schema.short_title;$('#formDescription').textContent=schema.description||'Merci de compléter les informations ci-dessous.';
 $('#formSections').className='';$('#formSections').innerHTML=(schema.sections||[]).map(sec=>`<section class="public-section"><h2>${esc(sec.title||'Questionnaire')}</h2>${sec.description?`<p>${esc(sec.description)}</p>`:''}<div class="public-questions">${(sec.questions||[]).map(questionMarkup).join('')}</div></section>`).join('');
 $('#publicForm').querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('change',applyRelevant));applyRelevant();
}
function evaluateRelevant(expression,root){
 const expr=String(expression||'').trim();if(!expr)return true;
 const clauses=expr.replace(/^\(|\)$/g,'').split(/\s+(and|or)\s+/i);let result=null,operator='and';
 for(const part of clauses){if(/^(and|or)$/i.test(part)){operator=part.toLowerCase();continue;}let c=part.trim().replace(/^\(|\)$/g,'');let m=c.match(/^not\s*\(\s*selected\s*\(\s*\$\{([^}]+)\}\s*,\s*['"]([^'"]+)['"]\s*\)\s*\)$/i),v=false;
 if(m){const vals=[...root.querySelectorAll(`[name="${CSS.escape(m[1])}"]:checked`)].map(x=>x.value);v=!vals.includes(m[2]);}
 else{m=c.match(/^selected\s*\(\s*\$\{([^}]+)\}\s*,\s*['"]([^'"]+)['"]\s*\)$/i);
 if(m){const vals=[...root.querySelectorAll(`[name="${CSS.escape(m[1])}"]:checked`)].map(x=>x.value);v=vals.includes(m[2]);}
 else{m=c.match(/^\$\{([^}]+)\}\s*(=|==|!=|>=|<=|>|<)\s*['"]?([^'"]*)['"]?$/);if(!m)return true;
 const target=root.querySelector(`[name="${CSS.escape(m[1])}"]`),actual=target?.value||'',expected=m[3];let left=actual,right=expected;
 if(['>','<','>=','<='].includes(m[2])){left=Number(actual);right=Number(expected);}
 switch(m[2]){case '=':case '==':v=String(left)===String(right);break;case '!=':v=String(left)!==String(right);break;case '>':v=left>right;break;case '<':v=left<right;break;case '>=':v=left>=right;break;case '<=':v=left<=right;break;}
 }}
 result=result===null?v:(operator==='and'?result&&v:result||v);
 }return result===null?true:!!result;
}
function applyRelevant(){
 document.querySelectorAll('[data-relevant]').forEach(node=>{const expr=node.dataset.relevant.trim();if(!expr){node.style.display='';return;}
 const show=evaluateRelevant(expr,$('#publicForm'));node.style.display=show?'':'none';
 const isCheckboxGroup=node.querySelectorAll('input[type="checkbox"]').length>0;
 node.querySelectorAll('input,select,textarea').forEach(el=>{el.required=show&&node.dataset.required==='true'&&!isCheckboxGroup;if(!show){if(el.type==='checkbox')el.checked=false;else el.value='';}});
});
}
$('#gpsButton').addEventListener('click',()=>{if(!navigator.geolocation){show('La géolocalisation n’est pas disponible sur cet appareil.','error');return;}$('#gpsButton').disabled=true; navigator.geolocation.getCurrentPosition(p=>{geo={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy};$('#gpsButton').textContent=`✓ Position ajoutée (${geo.latitude.toFixed(5)}, ${geo.longitude.toFixed(5)})`;$('#gpsButton').disabled=false;},e=>{show('Position GPS non obtenue : '+e.message,'error');$('#gpsButton').disabled=false;},{enableHighAccuracy:true,timeout:15000});});
function show(text,type='success'){$('#message').innerHTML=`<div class="alert ${type==='error'?'error':''}">${esc(text)}</div>`;}
$('#publicForm').addEventListener('submit',async e=>{e.preventDefault();const data={};for(const section of schema.sections||[])for(const q of section.questions||[]){const el=document.querySelector(`[name="${CSS.escape(q.name)}"]`);if(!el||el.closest('[data-q]')?.style.display==='none'||q.type==='note')continue;if(['multiselect','select_multiple'].includes(q.type)){data[q.name]=[...document.querySelectorAll(`[name="${CSS.escape(q.name)}"]:checked`)].map(x=>x.value);continue;}if(['image','file'].includes(q.type)){const file=el.files?.[0];if(file){if(file.size>4*1024*1024){show(`Le fichier ${q.label} dépasse 4 Mo.`,'error');return;}data[q.name]=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});}continue;}data[q.name]=el.value;}
 if(geo)data.gps=geo;$('#submitButton').disabled=true;$('#submitButton').textContent='Envoi en cours…';
 try{const res=await fetch(`/api/public/forms/${encodeURIComponent(token)}/submissions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});const payload=await res.json();if(!res.ok)throw new Error(payload.detail||'Erreur de soumission');$('#publicForm').reset();geo=null;show('Merci ! Votre réponse a été enregistrée avec succès. Référence : '+payload.id);$('#gpsButton').textContent='⌖ Ajouter ma position GPS';}
 catch(err){show(err.message,'error');}finally{$('#submitButton').disabled=false;$('#submitButton').textContent='Envoyer ma réponse →';}
});
async function load(){try{const res=await fetch(`/api/public/forms/${encodeURIComponent(token)}`);const data=await res.json();if(!res.ok)throw new Error(data.detail||'Formulaire indisponible');schema=data;render();}catch(e){$('#formTitle').textContent='Formulaire indisponible';$('#formDescription').textContent=e.message;$('#formSections').className='loading';$('#formSections').textContent='Ce lien est invalide, désactivé ou le formulaire n’est plus publié.';$('#publicForm').querySelector('.public-actions').style.display='none';}}
load();
})();
</script></body></html>
