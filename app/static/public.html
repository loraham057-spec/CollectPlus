<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b4a"><title>CollectPlus · Formulaire public</title><style>
:root{--navy:#142b4a;--teal:#167d91;--mint:#19a58a;--bg:#f2f5f9;--ink:#172b45;--muted:#697b91;--line:#e1e8ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf0f7,#f7fafc);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}.wrap{max-width:760px;margin:34px auto;padding:0 16px}.brand{display:flex;align-items:center;gap:12px;margin:0 0 20px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--teal),var(--mint));color:white;display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 8px 20px #167d912b}.brand strong{display:block;font-size:20px}.brand small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px #16314d0c;overflow:hidden}.hero{padding:26px 28px;background:linear-gradient(120deg,var(--navy),#1b4968);color:white}.hero .badge{display:inline-block;border-radius:99px;padding:4px 9px;background:#ffffff18;border:1px solid #ffffff26;font-size:11px;letter-spacing:.4px}.hero h1{font-size:clamp(23px,5vw,32px);line-height:1.2;margin:12px 0}.hero p{color:#d4e3ee;margin:0}.content{padding:24px 28px}.section{margin:0 0 24px}.section h2{font-size:16px;margin:0 0 5px;color:var(--navy)}.section-description{color:var(--muted);font-size:13px;margin:0 0 16px}.field{display:grid;gap:7px;margin:0 0 17px}.field label{font-weight:650;font-size:13px}.req{color:#d44}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #d9e2eb;border-radius:10px;background:#fbfcfe;color:var(--ink);font:inherit;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #167d9116}.hint{font-size:12px;color:var(--muted)}.gps{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.gps button{border:1px solid #c8e2e3;background:#eefafa;color:#126c78;padding:9px 12px;border-radius:9px;font-weight:700}.gps input{flex:1;min-width:160px}.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}.submit{border:0;border-radius:11px;background:linear-gradient(120deg,var(--teal),var(--mint));color:white;padding:13px 22px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #167d9123}.privacy{font-size:12px;color:var(--muted);max-width:340px}.message{display:none;padding:13px 15px;margin:0 0 17px;border-radius:11px;font-size:14px}.message.success{display:block;background:#eaf8f2;color:#18714e}.message.error{display:block;background:#fff0ef;color:#a13d35}.loading{padding:36px;text-align:center;color:var(--muted)}.foot{text-align:center;color:#8291a4;font-size:12px;padding:17px}@media(max-width:540px){.wrap{margin:18px auto}.hero,.content{padding:20px}.card{border-radius:17px}.actions{align-items:stretch;flex-direction:column}.submit{width:100%}}
</style></head><body><div class="wrap"><div class="brand"><div class="mark">C+</div><div><strong>CollectPlus</strong><small>Formulaire de collecte sécurisé par lien</small></div></div><main class="card"><div id="hero" class="hero"><span class="badge">RÉPONSE SANS COMPTE</span><h1>Chargement du questionnaire…</h1><p>Veuillez patienter.</p></div><div id="content" class="content"><div class="loading">Préparation du formulaire…</div></div></main><div class="foot">CollectPlus · Collecte intelligente des données</div></div><script>
(()=>{const token=location.pathname.split('/').filter(Boolean).pop();const $=s=>document.querySelector(s);let schema;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function input(q){const type=q.type||'text',name=esc(q.name),label=esc(q.label),required=q.required?'required':'',hint=q.hint?`<div class="hint">${esc(q.hint)}</div>`:'';if(type==='note')return `<div class="field"><label>${label}</label>${hint}</div>`;if(type==='select'||type==='multiselect'){const opts=(q.options||[]).map(o=>{const val=typeof o==='object'?(o.value??o.label):o,txt=typeof o==='object'?(o.label??o.value):o;return `<option value="${esc(val)}">${esc(txt)}</option>`}).join('');return `<div class="field"><label>${label}${q.required?' <span class="req">*</span>':''}</label><select name="${name}" ${required} ${type==='multiselect'?'multiple':''}>${type==='select'?'<option value="">Choisir…</option>':''}${opts}</select>${hint}</div>`}if(type==='geopoint'||['gps','location'].includes(name.toLowerCase()))return `<div class="field"><label>${label}${q.required?' <span class="req">*</span>':''}</label><div class="gps"><button type="button" data-gps="${name}">⌖ Obtenir le GPS</button><input name="${name}" placeholder="latitude longitude altitude précision" ${required}></div>${hint}</div>`;let htmltype=({number:'number',date:'date',time:'time',datetime:'datetime-local',email:'email',phone:'tel',textarea:'textarea'})[type]||'text';const control=htmltype==='textarea'?`<textarea name="${name}" rows="3" ${required}></textarea>`:`<input name="${name}" type="${htmltype}" ${required} ${type==='number'?'step="any"':''} placeholder="${esc(q.placeholder||'Saisir la réponse…')}">`;return `<div class="field"><label>${label}${q.required?' <span class="req">*</span>':''}</label>${control}${hint}</div>`}function render(){ $('#hero').innerHTML=`<span class="badge">RÉPONSE SANS COMPTE</span><h1>${esc(schema.title)}</h1><p>${esc(schema.description||'Merci de compléter ce questionnaire.')}</p>`;$('#content').innerHTML=`<div id="message" class="message"></div><form id="publicForm"><div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>${(schema.sections||[]).map((sec,i)=>`<section class="section"><h2>${esc(sec.title||`Section ${i+1}`)}</h2>${sec.description?`<p class="section-description">${esc(sec.description)}</p>`:''}${(sec.questions||[]).map(input).join('')}</section>`).join('')}<div class="actions"><div class="privacy">Ce formulaire est accessible par lien public. Ne saisissez pas d’informations sensibles non nécessaires.</div><button class="submit" type="submit">Envoyer ma réponse&nbsp; →</button></div></form>`;document.querySelectorAll('[data-gps]').forEach(b=>b.addEventListener('click',()=>{const input=document.querySelector(`[name="${CSS.escape(b.dataset.gps)}"]`);if(!navigator.geolocation){show('La géolocalisation n’est pas disponible sur ce navigateur.','error');return}b.disabled=true;b.textContent='Recherche GPS…';navigator.geolocation.getCurrentPosition(pos=>{input.value=[pos.coords.latitude,pos.coords.longitude,pos.coords.altitude??'',pos.coords.accuracy].join(' ');b.disabled=false;b.textContent='✓ GPS enregistré'},err=>{show('Impossible d’obtenir la position. Autorisez le GPS et réessayez.','error');b.disabled=false;b.textContent='⌖ Obtenir le GPS'},{enableHighAccuracy:true,timeout:20000})}));$('#publicForm').addEventListener('submit',submit)}function show(text,type){const el=$('#message');el.className='message '+type;el.textContent=text}async function submit(e){e.preventDefault();const form=e.currentTarget,data={website:form.elements.namedItem('website')?.value||''};for(const q of (schema.sections||[]).flatMap(s=>s.questions||[])){const el=form.elements.namedItem(q.name);if(!el||q.type==='note')continue;if(el instanceof RadioNodeList)continue;if(el.multiple)data[q.name]=[...el.selectedOptions].map(o=>o.value);else data[q.name]=el.value.trim();if(q.required&&(data[q.name]===''||Array.isArray(data[q.name])&&!data[q.name].length)){el.focus();show(`Veuillez répondre : ${q.label}`,'error');return}}const btn=form.querySelector('.submit');btn.disabled=true;btn.textContent='Envoi en cours…';try{const res=await fetch(`/api/public/forms/${encodeURIComponent(token)}/submissions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});const body=await res.json();if(!res.ok)throw new Error(body.detail||'La soumission a échoué');form.innerHTML=`<div style="text-align:center;padding:25px 0"><div style="font-size:46px;color:#19a58a">✓</div><h2>Réponse enregistrée</h2><p style="color:#697b91">${esc(body.message||'Merci pour votre participation.')}</p><small>Référence : ${esc(body.id)}</small></div>`}catch(err){show(err.message,'error');btn.disabled=false;btn.textContent='Envoyer ma réponse →'}}async function init(){try{const res=await fetch(`/api/public/forms/${encodeURIComponent(token)}`);if(!res.ok)throw new Error('Ce formulaire est fermé ou le lien est invalide.');schema=await res.json();render()}catch(e){$('#hero').innerHTML='<span class="badge">LIEN INDISPONIBLE</span><h1>Formulaire non accessible</h1><p>Le propriétaire a fermé ce lien ou celui-ci est incorrect.</p>';$('#content').innerHTML=`<div class="message error" style="display:block">${esc(e.message)}</div>`}}init()})();
</script></body></html>
