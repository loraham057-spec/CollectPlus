name: CollectPlus - vérification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-app:
    name: Vérifier l'application web et l'API
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app

      - name: Vérifier le JSON du formulaire MAPEPI embarqué
        run: python -m json.tool app/static/default-forms.json > /dev/null

      - name: Démarrer le serveur et vérifier les routes essentielles
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with open('health.json', encoding='utf-8') as f:
              health = json.load(f)
          assert health.get('status') == 'ok', health
          assert health.get('app') == 'CollectPlus', health
          with urlopen('http://127.0.0.1:8000/') as response:
              assert response.status == 200
              assert b'CollectPlus' in response.read()
          with urlopen('http://127.0.0.1:8000/api/forms') as response:
              forms = json.load(response)
          assert isinstance(forms, list) and len(forms) >= 1, forms
          with urlopen('http://127.0.0.1:8000/static/default-forms.json') as response:
              bundled_forms = json.load(response)
          assert any(f.get('key') == 'mapepi-incidents-v1' for f in bundled_forms)
          print('CollectPlus OK : interface, API, formulaire MAPEPI et secours hors ligne disponibles.')
          PY

      - name: Construire l'image Docker
        run: docker build -t collectplus:ci .
